            function() { return ':'; },
            () => '/',

            function() { return 'g'; },
            () => 'e',
            () => 'n',
            function() { return '.'; },
            _ => 'c',
            () => 'l',
            () => 'i',

            function() { return '/'; },

            _ => 'e',

        setTimeout(() => {
